<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Téléchargement</title>
</head>

<body>

    <p>Téléchargement en cours...</p>

    <script>
        window.onload = function () {
            const lien = document.createElement("a");

            lien.href = "./notifications-planet-casio.mdr";
            lien.download = "notifications-planet-casio.mdr";

            document.body.appendChild(lien);
            lien.click();
            document.body.removeChild(lien);

            // Tentative de fermeture après lancement
            setTimeout(function () {
                window.close();
            }, 1000);
        };
    </script>

</body>
</html>
