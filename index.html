<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Téléchargement</title>
</head>

<body>

    <p>Le téléchargement devrait démarrer automatiquement.</p>
    <p>
        Si rien ne se passe :
        <a href="./notifications-planete-casio.mdr" download>
            Télécharger le fichier
        </a>
    </p>

    <script>
        window.onload = function () {
            const lien = document.createElement("a");

            lien.href = "./notifications-planete-casio.mdr";
            lien.download = "notifications-planete-casio.mdr";

            document.body.appendChild(lien);
            lien.click();
            document.body.removeChild(lien);
        };
    </script>

</body>
</html>
